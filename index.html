      var a = JSON.parse(localStorage.getItem("prepa.appareil") || "{}");
      if (a.theme === "clair" || a.theme === "sombre") document.documentElement.setAttribute("data-theme", a.theme);

    /* Le manifeste (version installable) n'est utile qu'en ligne. En double-clic, le
       navigateur refuserait de le lire et afficherait une erreur inutile. */

      var m = document.createElement("link");
      m.rel = "manifest";
      m.href = "manifest.webmanifest";
      document.head.appendChild(m);
    }
